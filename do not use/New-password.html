<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="asset/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <section>
        <div class="container">
            <div class="card">
                <div class="card-body">
                    <h1 class="cart-title">Create New Password</h1>
                    <form action="login.html" method="GET">
                        <div class="mb-3">
                            <label class="form-label" for="pass"><i class="bi bi-lock"></i> Password</label>
                            <input class="form-control" type="password" name="pass" id="pass" placeholder="Password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="pass"><i class="bi bi-lock"></i> Confirm Password</label>
                            <input class="form-control" type="password" name="con-pass" id="con-pass" placeholder="Confirm Password" required>
                        </div>
                        </div>
                        <button type="submit" class="btn">Send</button>
                        <p class="text">
                            Already have an account? <a href="login.html">login</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
