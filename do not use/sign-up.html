<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="asset/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <section>
        <div class="container">
            <div class="card">
                <div class="card-body">
                    <h1 class="cart-title">Sign up</h1>
                    <form action="login.html" method="GET">
                        <div class="d-flex mb-3">
                            <div>
                                <i class="bi bi-person-rolodex"></i>
                                <label class="form-label" for="me">First Name</label>
                                <input class="form-control" type="text" name="First" id="First" placeholder="First Name" required>
                            </div>
                            <div>
                                <i class="bi bi-person-rolodex"></i>
                                <label class="form-label" for="me">Last Name</label>
                                <input class="form-control" type="text" name="Last" id="Last" placeholder="Last Name" required>
                            </div>
                        </div>
                      <div class="mb-3">
                            <label class="form-label" for="email"><i class="bi bi-envelope-open"></i> Email</label>
                            <input class="form-control" type="email" name="email" id="email" placeholder="Email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="pass"><i class="bi bi-lock"></i> Password</label>
                            <input class="form-control" type="password" name="pass" id="pass" placeholder="Password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="pass"><i class="bi bi-lock"></i> Confirm Password</label>
                            <input class="form-control" type="password" name="con-pass" id="con-pass" placeholder="Confirm Password" required>
                        </div>
                        </div>
                        <button type="submit" class="btn">Sign up</button>
                        <p class="text">
                            Already have an account? <a href="login.html">login</a>
                        </p>
                        <div class="d-flex text-nowrap">
                            <hr width="35%" size="1" color="#000029">
                            or connect with
                            <hr width="35%" size="1" color="#000029">
                        </div>

                        <div class="connect">
                            <a href=""><img src="asset/img/facebook.png" alt=""></a>
                            <a href=""><img src="asset/img/google.png" alt=""></a>
                            <a href=""><img src="asset/img/x.png" alt=""></a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
