<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="asset/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <section>
        <div class="container">
            <div class="card">
                <div class="card-body">
                    <h1 class="cart-title">Login</h1>
                    <form action="" method="GET">
                      <div class="mb-3">
                            <label class="form-label" for="email"><i class="bi bi-envelope-open"></i> Email</label>
                            <input class="form-control" type="email" name="email" id="email" placeholder="Email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="pass"><i class="bi bi-lock"></i> Password</label>
                            <input class="form-control" type="password" name="pass" id="pass" placeholder="Password" required>
                        </div>
                        <div class="d-flex mb-3">
                            <div>
                                <input class="checkbox" type="checkbox" name="me" id="me">
                                <label class="form-label" for="me">Remember me</label>
                            </div>
                            <a href="forget.html">Forget password?</a>
                        </div>
                        <button type="submit" class="btn">Login</button>
                        <p class="text">
                            Don't have an account? <a href="sign-up.html">Sign up</a>
                        </p>
                        <div class="d-flex text-nowrap">
                            <hr width="35%" size="1" color="#000029">
                            or connect with
                            <hr width="35%" size="1" color="#000029">
                        </div>

                        <div class="connect">
                            <a href=""><img src="asset/img/facebook.png" alt=""></a>
                            <a href=""><img src="asset/img/google.png" alt=""></a>
                            <a href=""><img src="asset/img/x.png" alt=""></a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
